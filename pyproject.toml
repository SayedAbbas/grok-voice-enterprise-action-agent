[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "grok-voice-enterprise-action-agent"
version = "0.1.0"
description = "Production-inspired enterprise action agent architecture for Grok Voice."
